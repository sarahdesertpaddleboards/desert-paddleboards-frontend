<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- Favicon + theme -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#1f3a4d" />

    <!-- Open Graph (site-wide defaults; per-page <title> set by the app) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Desert Paddleboards" />
    <meta
      property="og:title"
      content="Desert Paddleboards — Floating Soundbaths in Arizona" />
    <meta
      property="og:description"
      content="Float weightlessly as live sound washes over you. Find a floating soundbath near you across Phoenix, Mesa, Scottsdale, Tempe and more — and book online." />
    <meta
      property="og:image"
      content="https://desertpaddleboards.com/floating-boards-sunset.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Desert Paddleboards — Floating Soundbaths in Arizona" />
    <meta
      name="twitter:description"
      content="Float weightlessly as live sound washes over you. Find a floating soundbath near you and book online." />
    <meta
      name="twitter:image"
      content="https://desertpaddleboards.com/floating-boards-sunset.jpg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Still Water theme: Playfair Display (literary serif headlines) + Josefin Sans (airy body/UI) -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Josefin+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

  </body>

</html>
