# Cloudflare Pages config — frontend + same-origin Pages Functions.
# The /experiences/upcoming session feed lives in functions/ (replaces the
# Railway backend for the public site). Deploy: pnpm build && wrangler pages deploy
name = "desert-paddleboards"
compatibility_date = "2026-06-01"
pages_build_output_dir = "dist"

# --- Staff scheduling tool (/staff + /staff-api) -----------------------------
# Cloudflare D1 (SQLite) database for staff, shifts, applications and payments.
# Schema lives in migrations/ — apply with:
#   wrangler d1 migrations apply dpb-staff --local            (local dev)
#   wrangler d1 migrations apply dpb-staff-preview --remote   (preview branch)
#   wrangler d1 migrations apply dpb-staff --remote           (production)
# Secrets (set per environment in the Pages dashboard or `wrangler pages secret put`):
#   RESEND_API_KEY                — sends login links + confirmations
#   STAFF_BOOTSTRAP_ADMIN_EMAILS  — comma list; these emails become admins on first login
#   TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM — shift texts (see docs/staff-tool.md)
#   SMS_TEST_NUMBERS              — optional; when set, only these numbers get texts
# Vars: STAFF_EMAIL_FROM, STAFF_EMAIL_REPLY_TO (see [vars]).
#
# Databases live in the Desert Paddleboards Cloudflare account
# (admin@desertpaddleboards.com): dpb-staff (production, region WNAM) and
# dpb-staff-preview (the `staff` branch preview, region WEUR). Local dev
# (`wrangler pages dev`) ignores these ids and uses a local SQLite file.
# Use `pnpm cf …` to run wrangler against that account.

[vars]
STAFF_EMAIL_FROM = "Desert Paddleboards <sarah@desertpaddleboards.com>"
STAFF_EMAIL_REPLY_TO = "sarah@desertpaddleboards.com"

[[d1_databases]]
binding = "STAFF_DB"
database_name = "dpb-staff"
database_id = "7801177c-5e8f-4679-b0dd-319df6027cfe"

[env.preview]
[env.preview.vars]
STAFF_EMAIL_FROM = "Desert Paddleboards (test) <sarah@desertpaddleboards.com>"
STAFF_EMAIL_REPLY_TO = "sarah@desertpaddleboards.com"

[[env.preview.d1_databases]]
binding = "STAFF_DB"
database_name = "dpb-staff-preview"
database_id = "2663c7b1-ab2f-4d74-a2b1-ea4e74d048ea"
