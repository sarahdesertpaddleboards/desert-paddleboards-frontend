name: Staff day-before reminders

# Every 30 minutes, ask the staff tool to send any due day-before reminders
# (everyone confirmed on a shift starting within 24 hours; the event lead's
# includes the private venue contact). Pages has no cron, so this nudges it.
# The app also sends them lazily when someone opens the staff area.
#
# One-time setup (same random value in both places):
#   1. GitHub repo secret STAFF_CRON_SECRET
#   2. Cloudflare Pages secret STAFF_CRON_SECRET for each environment:
#        pnpm cf pages secret put STAFF_CRON_SECRET --project-name desert-paddleboards --env preview
#        pnpm cf pages secret put STAFF_CRON_SECRET --project-name desert-paddleboards --env production
# Scheduled workflows only run from the default branch (main).

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        # Preview (the staff branch) while the tool is being tested; the live
        # site once it's merged. A 404 there just means it isn't live yet.
        url:
          - https://staff.desert-paddleboards.pages.dev
          - https://desertpaddleboards.com
    steps:
      - name: Send due reminders
        env:
          SECRET: ${{ secrets.STAFF_CRON_SECRET }}
          URL: ${{ matrix.url }}
        run: |
          if [ -z "$SECRET" ]; then echo "STAFF_CRON_SECRET not set; skipping."; exit 0; fi
          code=$(curl -s -o out.json -w "%{http_code}" -X POST "$URL/staff-api/cron/reminders" -H "authorization: Bearer $SECRET")
          echo "$URL -> HTTP $code"; cat out.json; echo
          if [ "$code" = "404" ]; then echo "Not live on this host yet."; exit 0; fi
          [ "$code" = "200" ]
